name: Sprint1 CI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configue AWS credentials
        uses: aws-actions/Configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::237575223564:role/sprint3-github-actions-role
          aws-region: ap-northeast-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity    

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Upload JAR to S3
        run: aws s3 cp target/sprint1-0.0.1-SNAPSHOT.jar s3://sprint3-app-artifacts-237575223564-ap-northeast-1-an/cd/app.jar  

      - name: Deregister node-b from Target Group
        run: |
          aws elbv2 deregister-targets \
            --target-group-arn "arn:aws:elasticloadbalancing:ap-northeast-1:237575223564:targetgroup/sprint3-tg/1420dd246dfd0658" \
            --targets Id=i-0ff597bad8d57dfcb

          aws elbv2 wait target-deregistered \
            --target-group-arn "arn:aws:elasticloadbalancing:ap-northeast-1:237575223564:targetgroup/sprint3-tg/1420dd246dfd0658" \
            --targets Id=i-0ff597bad8d57dfcb

      - name: Deploy to EC2 with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0ff597bad8d57dfcb" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -e","cp /home/ec2-user/sprint1/app.jar /home/ec2-user/sprint1/app.jar.bak","aws s3 cp s3://sprint3-app-artifacts-237575223564-ap-northeast-1-an/cd/app.jar /home/ec2-user/sprint1/app.jar.new","mv /home/ec2-user/sprint1/app.jar.new /home/ec2-user/sprint1/app.jar","chown ec2-user:ec2-user /home/ec2-user/sprint1/app.jar","systemctl restart sprint1","sleep 10","systemctl is-active sprint1","curl --fail http://localhost:8080/health"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0ff597bad8d57dfcb"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0ff597bad8d57dfcb"  

      - name: Register node-b to Target Group
        run: |
          aws elbv2 register-targets \
            --target-group-arn "arn:aws:elasticloadbalancing:ap-northeast-1:237575223564:targetgroup/sprint3-tg/1420dd246dfd0658" \
            --targets Id=i-0ff597bad8d57dfcb

          aws elbv2 wait target-in-service \
            --target-group-arn "arn:aws:elasticloadbalancing:ap-northeast-1:237575223564:targetgroup/sprint3-tg/1420dd246dfd0658" \
            --targets Id=i-0ff597bad8d57dfcb 

      - name: Deregister node-a from Target Group
        run: |
          aws elbv2 deregister-targets \
            --target-group-arn "arn:aws:elasticloadbalancing:ap-northeast-1:237575223564:targetgroup/sprint3-tg/1420dd246dfd0658" \
            --targets Id=i-074edf0bfb90ab32d

          aws elbv2 wait target-deregistered \
            --target-group-arn "arn:aws:elasticloadbalancing:ap-northeast-1:237575223564:targetgroup/sprint3-tg/1420dd246dfd0658" \
            --targets Id=i-074edf0bfb90ab32d

      - name: Deploy to node-a with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-074edf0bfb90ab32d" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -e","cp /home/ec2-user/sprint1/app.jar /home/ec2-user/sprint1/app.jar.bak","aws s3 cp s3://sprint3-app-artifacts-237575223564-ap-northeast-1-an/cd/app.jar /home/ec2-user/sprint1/app.jar.new","mv /home/ec2-user/sprint1/app.jar.new /home/ec2-user/sprint1/app.jar","chown ec2-user:ec2-user /home/ec2-user/sprint1/app.jar","systemctl restart sprint1","sleep 10","systemctl is-active sprint1","curl --fail http://localhost:8080/health"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-074edf0bfb90ab32d"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-074edf0bfb90ab32d"

      - name: Register node-a to Target Group
        run: |
          aws elbv2 register-targets \
            --target-group-arn "arn:aws:elasticloadbalancing:ap-northeast-1:237575223564:targetgroup/sprint3-tg/1420dd246dfd0658" \
            --targets Id=i-074edf0bfb90ab32d

          aws elbv2 wait target-in-service \
            --target-group-arn "arn:aws:elasticloadbalancing:ap-northeast-1:237575223564:targetgroup/sprint3-tg/1420dd246dfd0658" \
            --targets Id=i-074edf0bfb90ab32d                              

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-jar
          path: target/*.jar 



  
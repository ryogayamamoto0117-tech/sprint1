name: Sprint1 CI

on:
  push:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configue AWS credentials
        uses: aws-actions/Configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::237575223564:role/sprint3-github-actions-role
          aws-region: ap-northeast-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity    

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Upload JAR to S3
        run: aws s3 cp target/sprint1-0.0.1-SNAPSHOT.jar s3://sprint3-app-artifacts-237575223564-ap-northeast-1-an/cd/app.jar  

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprint1-jar
          path: target/*.jar 



  
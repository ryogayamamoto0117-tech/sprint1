name: Terraform CI

on:
  push:
    branches:
      - master
    paths:
      - 'infra/sprint6/**'
      - '.github/workflows/terraform.yml'

  pull_request:
    branches:
      - master
    paths:
      - 'infra/sprint6/**'
      - '.github/workflows/terraform.yml'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/sprint6

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237575223564:role/terraform-plan-github-actions-role
          aws-region: ap-northeast-1

      - name: Initialize Terraform with S3 backend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: terraform init -reconfigure -input=false

      - name: Plan Terraform changes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: terraform plan -input=false
        